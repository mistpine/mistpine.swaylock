# Filing through the API or `gh issue create`? Forms only apply on the web:
# write the body with each field's label below as a `### ` heading, in order.
name: Wrong or broken colors
description: A color that differs from the spec, or swaylock rejecting the config.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        mistpine.swaylock follows the [mistpine spec](https://github.com/mistpine/mistpine/blob/main/docs/spec.md).
        A color that differs from the spec is a bug here; a spec color you'd like
        changed belongs in [mistpine](https://github.com/mistpine/mistpine/issues/new/choose).
  - type: textarea
    id: what
    attributes:
      label: What's wrong
      description: What you see, where (the ring, the inside, the text, a state such as typing, wrong or clear), and what you expected.
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: Drag an image here.
  - type: textarea
    id: config
    attributes:
      label: swaylock config
      description: "Your `~/.config/swaylock/config`, and how you start swaylock (swayidle, a keybinding)."
      render: ini
  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: "`swaylock --version` (and whether it is swaylock-effects), the compositor and its version, the distribution, and where the file came from."
      render: text
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I'm using the latest `themes/` from main.
          required: true
        - label: "`swaylock` starts with the config without printing errors."
